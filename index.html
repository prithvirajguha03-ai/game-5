<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-100 via-purple-100 to-slate-100">

  <div class="flex flex-col items-center gap-5 p-6 w-full max-w-xl mx-auto">
    <h1 class="text-3xl sm:text-4xl font-bold text-slate-800 tracking-wide">Memory Game</h1>

    <div class="flex items-center gap-6 text-slate-600/80 text-sm sm:text-base">
      <span>Moves: <strong id="moves" class="text-slate-800">0</strong></span>
      <span>Pairs: <strong id="pairs" class="text-slate-800">0</strong>/<span id="total-pairs">8</span></span>
      <span>Level: <strong id="level-label" class="text-slate-800">Normal</strong></span>
    </div>

    <div id="board" class="grid grid-cols-4 gap-2.5 sm:gap-3 w-full">
    </div>

    <div class="flex flex-wrap items-center justify-center gap-3 mt-1">
      <button id="restart" class="px-6 py-2.5 rounded-lg bg-purple-600 hover:bg-purple-500 active:bg-purple-700 text-white font-semibold text-sm sm:text-base transition-colors duration-150 cursor-pointer focus-visible:ring-4 focus-visible:ring-purple-400/60 focus-visible:outline-none">
        Restart
      </button>
      <button id="change-difficulty" class="px-6 py-2.5 rounded-lg bg-white/70 hover:bg-white active:bg-white/40 text-slate-700 font-semibold text-sm sm:text-base border border-slate-300 transition-colors duration-150 cursor-pointer focus-visible:ring-4 focus-visible:ring-indigo-300 focus-visible:outline-none">
        Change Difficulty
      </button>
    </div>
  </div>

  <div id="overlay" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-white rounded-2xl p-8 sm:p-10 text-center flex flex-col items-center gap-5 shadow-2xl max-w-sm mx-4">
      <div class="text-5xl">🎉</div>
      <h2 class="text-2xl sm:text-3xl font-bold text-gray-800">You Win!</h2>
      <p class="text-gray-500 text-sm sm:text-base">Completed in <strong id="final-moves" class="text-gray-700">0</strong> moves <span class="text-gray-400">on <strong id="final-level" class="text-gray-500">Normal</strong></span></p>
      <button id="play-again" class="px-6 py-2.5 rounded-lg bg-purple-600 hover:bg-purple-500 active:bg-purple-700 text-white font-semibold text-sm sm:text-base transition-colors duration-150 cursor-pointer focus-visible:ring-4 focus-visible:ring-purple-400/60 focus-visible:outline-none">
        Play Again
      </button>
      <button id="overlay-difficulty" class="px-6 py-2.5 rounded-lg bg-white text-gray-700 border border-gray-200 hover:bg-gray-50 active:bg-gray-100 font-semibold text-sm sm:text-base transition-colors duration-150 cursor-pointer focus-visible:ring-4 focus-visible:ring-purple-400/40 focus-visible:outline-none">
        Change Difficulty
      </button>
    </div>
  </div>

  <script src="./src/difficulty.js"></script>
  <script>
    const SYMBOL_POOL = ['🍎','🍇','🍊','🍋','🫐','🍑','🍒','🥝','🍉','🍓','🍌','🍍','🥥','🫒','🌽','🥕'];

    const DIFFICULTY_CONFIG = {
      easy:   { pairs: 4 },
      normal: { pairs: 8 },
      hard:   { pairs: 12 }
    };
    const DIFFICULTY_HINTS = {
      easy:   '8 cards — match 4 pairs',
      normal: '16 cards — match 8 pairs',
      hard:   '24 cards — match 12 pairs'
    };
    const DIFFICULTY_LABELS = { easy: 'Easy', normal: 'Normal', hard: 'Hard' };

    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const pairsEl = document.getElementById('pairs');
    const totalPairsEl = document.getElementById('total-pairs');
    const levelLabelEl = document.getElementById('level-label');
    const overlay = document.getElementById('overlay');
    const finalMovesEl = document.getElementById('final-moves');
    const finalLevelEl = document.getElementById('final-level');
    const restartBtn = document.getElementById('restart');
    const changeDifficultyBtn = document.getElementById('change-difficulty');
    const playAgainBtn = document.getElementById('play-again');
    const overlayDifficultyBtn = document.getElementById('overlay-difficulty');

    let currentDifficulty = 'normal';
    let hasSessionStarted = false;
    let difficultyScreen = null;

    let cards = [];
    let flipped = [];
    let matched = new Set();
    let moves = 0;
    let pairsFound = 0;
    let locked = false;
    let generation = 0;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pairCountFor(difficulty) {
      const config = DIFFICULTY_CONFIG[GameDifficulty.normalize(difficulty)];
      return config ? config.pairs : DIFFICULTY_CONFIG.normal.pairs;
    }

    function createBoard() {
      const pairs = pairCountFor(currentDifficulty);
      const symbols = SYMBOL_POOL.slice(0, pairs);
      board.innerHTML = '';
      const deck = shuffle([...symbols, ...symbols]);
      cards = deck;
      flipped = [];
      matched = new Set();
      moves = 0;
      pairsFound = 0;
      locked = false;
      generation++;
      movesEl.textContent = '0';
      pairsEl.textContent = '0';
      totalPairsEl.textContent = pairs;
      overlay.classList.add('hidden');

      deck.forEach((symbol, index) => {
        const card = document.createElement('div');
        card.className = 'card-container aspect-square cursor-pointer';
        card.dataset.index = index;
        card.dataset.symbol = symbol;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-face card-front">
              <span class="text-2xl sm:text-3xl select-none">?</span>
            </div>
            <div class="card-face card-back">
              <span class="text-2xl sm:text-4xl select-none">${symbol}</span>
            </div>
          </div>
        `;

        card.addEventListener('click', () => handleClick(index));
        board.appendChild(card);
      });
    }

    function handleClick(index) {
      if (locked) return;
      if (matched.has(index)) return;
      if (flipped.includes(index)) return;
      if (flipped.length >= 2) return;

      const cardEl = board.children[index];
      cardEl.classList.add('flipped');
      flipped.push(index);

      if (flipped.length === 2) {
        moves++;
        movesEl.textContent = moves;
        locked = true;

        const [i, j] = flipped;
        if (cards[i] === cards[j]) {
          matched.add(i);
          matched.add(j);
          pairsFound++;
          pairsEl.textContent = pairsFound;
          cardEl.classList.add('matched');
          board.children[j].classList.add('matched');
          flipped = [];
          locked = false;

          if (pairsFound === pairCountFor(currentDifficulty)) {
            const g = generation;
            setTimeout(() => {
              if (g !== generation) return;
              finalMovesEl.textContent = moves;
              finalLevelEl.textContent = DIFFICULTY_LABELS[currentDifficulty];
              overlay.classList.remove('hidden');
            }, 400);
          }
        } else {
          const g = generation;
          setTimeout(() => {
            if (g !== generation) return;
            board.children[i].classList.remove('flipped');
            board.children[j].classList.remove('flipped');
            flipped = [];
            locked = false;
          }, 700);
        }
      }
    }

    function setDifficultyLabel() {
      levelLabelEl.textContent = DIFFICULTY_LABELS[currentDifficulty];
    }

    function openDifficultyScreen() {
      if (!difficultyScreen) {
        const levels = GameDifficulty.levels.map(level => ({
          id: level.id,
          label: level.label,
          tagline: level.tagline,
          hint: DIFFICULTY_HINTS[level.id]
        }));
        difficultyScreen = GameDifficulty.createSelector({
          root: document.body,
          eyebrow: 'Memory Game',
          title: 'Choose Your Difficulty',
          intro: 'Select how challenging you want today\u2019s activity to be.',
          levels,
          initial: currentDifficulty,
          onStart: startGameFromDifficulty,
          onBack: function onDifficultyBack() {
            if (hasSessionStarted) {
              closeDifficultyScreen();
            } else if (history.length > 1) {
              history.back();
            }
          }
        });
      }
      difficultyScreen.selectLevel(currentDifficulty);
      difficultyScreen.show();
    }

    function closeDifficultyScreen() {
      if (difficultyScreen) difficultyScreen.hide();
    }

    function isDifficultyScreenOpen() {
      return !!difficultyScreen && difficultyScreen.isVisible();
    }

    function startGameFromDifficulty(diff) {
      hasSessionStarted = true;
      currentDifficulty = GameDifficulty.normalize(diff);
      setDifficultyLabel();
      closeDifficultyScreen();
      createBoard();
    }

    restartBtn.addEventListener('click', () => {
      if (isDifficultyScreenOpen()) return;
      createBoard();
    });
    playAgainBtn.addEventListener('click', () => {
      if (isDifficultyScreenOpen()) return;
      createBoard();
    });
    changeDifficultyBtn.addEventListener('click', openDifficultyScreen);
    overlayDifficultyBtn.addEventListener('click', openDifficultyScreen);

    setDifficultyLabel();
    openDifficultyScreen();
  </script>
</body>
</html>
